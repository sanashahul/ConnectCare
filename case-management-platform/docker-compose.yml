# Local development database only. Do not put real client data in a local dev database.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: connectcare
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: connectcare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
